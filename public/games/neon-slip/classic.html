for(const g of gates){const before=g.y-PY;g.y+=speed*dt;const after=g.y-PY;let collision=Math.min(before,after)<R+12&&Math.max(before,after)>-R-12&&(px-R<g.x-g.gap/2||px+R>g.x+g.gap/2);if(collision&&invincible<=0){if(shield){shield=false;invincible=1.2;shake=7;burst(px,PY,'#adff6c',22);toast('SHIELD SAVED YOU');tone(220,.15);$('status').textContent='SLIP THROUGH THE GAPS'}else{finish();break}}if(!g.passed&&g.y>PY+24){g.passed=true;gateCount++;score+=10;if(invincible<=0){let edge=Math.min(Math.abs(px-(g.x-g.gap/2)),Math.abs(px-(g.x+g.gap/2)));if(edge<27){score+=15;toast('CLOSE CALL +15');tone(600)}}}}
if(mode==='playing')for(const it of items){const before=it.y-PY;it.y+=speed*dt;const after=it.y-PY,verticalDistance=before*after<=0?0:Math.min(Math.abs(before),Math.abs(after));if(!it.hit&&Math.hypot(it.x-px,verticalDistance)<26){it.hit=true;burst(it.x,it.y,it.type==='spark'?'#f6cf66':'#adff6c',12);if(it.type==='spark'){sparks++;combo++;score+=25+Math.min(combo,10)*5;tone(550+Math.min(combo,10)*65);if(combo%5===0)toast(combo+' SPARK STREAK')}else{shield=true;toast('SHIELD ON');$('status').textContent='SHIELD ACTIVE';tone(1000,.2)}}else if(!it.hit&&it.y>PY+35&&it.type==='spark'){combo=0;it.hit=true}}
gates=gates.filter(g=>g.y<H+40);items=items.filter(i=>i.y<H+40&&!i.hit);hud();}
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt}particles=particles.filter(p=>p.life>0);for(const tr of trail){tr.life-=dt;tr.y+=runSpeed()*dt}trail=trail.filter(tr=>tr.life>0);shake=Math.max(0,shake-dt*35);if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').classList.remove('show')}}
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c261e');bg.addColorStop(1,'#071913');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.lineWidth=1;ctx.strokeStyle='#25473755';for(let x=35;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(phase*50)%50;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#77bf7f';for(let i=0;i<20;i++){let y=(i*83+phase*(15+i%3*6))%H;ctx.globalAlpha=.1+(i%3)*.06;ctx.fillRect((i*137+27)%W,y,2,2)}ctx.globalAlpha=1;
const demo=mode==='menu';let visibleGates=demo?[{y:180,x:225,gap:108},{y:390,x:160,gap:108}]:gates;
for(const g of visibleGates){let l=g.x-g.gap/2,r=g.x+g.gap/2;ctx.shadowColor='#ff657f';ctx.shadowBlur=13;round(-8,g.y-12,l+8,24,6,'#fa6681');round(r,g.y-12,W-r+8,24,6,'#fa6681');ctx.shadowBlur=0;round(0,g.y-12,l,3,2,'#ffb9c3');round(r,g.y-12,W-r,3,2,'#ffb9c3');ctx.strokeStyle='#ec839936';ctx.setLineDash([3,8]);ctx.beginPath();ctx.moveTo(l+15,g.y);ctx.lineTo(r-15,g.y);ctx.stroke();ctx.setLineDash([])}
for(const it of demo?[{x:225,y:110,type:'spark'}]:items){ctx.save();ctx.translate(it.x,it.y);if(it.type==='spark'){ctx.rotate(Math.PI/4+Math.sin(phase*3)*.1);ctx.shadowBlur=16;ctx.shadowColor='#ffdc79';round(-8,-8,16,16,3,'#f6cf66');ctx.shadowBlur=0;round(-4,-4,5,5,1,'#fff4c3')}else{ctx.strokeStyle='#adff6c';ctx.shadowColor='#adff6c';ctx.shadowBlur=16;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.stroke();ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillStyle='#adff6c';ctx.fillText('+',0,6)}ctx.restore()}
for(const tr of trail){ctx.globalAlpha=tr.life/.35*.3;round(tr.x-5,tr.y,10,20,5,'#adff6c')}ctx.globalAlpha=1;
if(mode!=='over'||particles.length){ctx.save();ctx.translate(demo?W/2:px,PY);if(invincible>0&&Math.floor(phase*15)%2)ctx.globalAlpha=.35;if(shield){ctx.strokeStyle='#adff6c';ctx.lineWidth=2;ctx.shadowBlur=15;ctx.shadowColor='#adff6c';ctx.beginPath();ctx.arc(0,0,23+Math.sin(phase*5)*2,0,Math.PI*2);ctx.stroke()}ctx.shadowColor='#adff6c';ctx.shadowBlur=25;round(-10,-13,20,26,7,'#adff6c');ctx.shadowBlur=0;round(-5,-8,10,8,3,'#ecffd1');round(-5,5,10,4,2,'#598b39');ctx.restore()}
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);round(p.x-2,p.y-2,4,4,1,p.color)}ctx.globalAlpha=1;ctx.restore()}
function frame(now){let dt=Math.min((now-last)/1000||0,.033);last=now;update(dt);draw();requestAnimationFrame(frame)}resize();requestAnimationFrame(frame);
})();
</script>
