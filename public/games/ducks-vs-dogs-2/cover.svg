  <g transform="translate(286 118) rotate(12)"><circle r="24" fill="#ff5a4a" stroke="#2b1e1a" stroke-width="5"/><text y="12" text-anchor="middle" font-family="Bangers, Impact, 'Arial Black', sans-serif" font-size="34" fill="#fff" stroke="#2b1e1a" stroke-width="4" paint-order="stroke fill">2</text></g>
