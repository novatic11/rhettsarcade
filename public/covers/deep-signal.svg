<title id="deep-signal-t">Deep Signal — what waits below</title>
<desc id="deep-signal-d">A small yellow and teal salvage submarine pings the dark with mint sonar rings. Its headlamp finds a glowing salvage pod on a ledge beneath drifting jellyfish, while a huge eye opens in the depths.</desc>
