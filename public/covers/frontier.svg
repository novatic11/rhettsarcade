<title id="frontier-t">Frontier — first light on the colony</title>
<desc id="frontier-d">A young colony at dawn on a teal alien plain under two suns: domed habitats, a glowing greenhouse, solar rows and a rover, with a launch tower and rocket waiting on the horizon.</desc>
