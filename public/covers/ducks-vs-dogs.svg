<title id="ducks-vs-dogs-t">Ducks vs Dogs — hold the pond</title>
<desc id="ducks-vs-dogs-d">A duck squad defends three garden lanes beside a little pond. One duck gathers breadcrumbs, one fires a water blaster and one holds a shield as a mixed pack of dogs trots in from the right.</desc>
