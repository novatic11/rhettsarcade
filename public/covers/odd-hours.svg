<title id="odd-hours-t">Odd Hours — something changed</title>
<desc id="odd-hours-d">A night-shift security desk with a monitor split into four museum camera feeds: a statue, a gallery painting, a long hallway and a vase. In one feed the painting's eyes glow red. A reference photo and a red report button sit on the desk.</desc>
