<title id="switchyard-t">Switchyard — clear the crossing</title>
<desc id="switchyard-d">A top-down railway yard where curving tracks merge through glowing switch points. Teal, orange and violet trains thread the lines while a road crossing waits with barriers down and red lights flashing.</desc>
